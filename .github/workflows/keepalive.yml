name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days of NO commits to THIS (code)
# repo. The daily hunt/sync push to the STATE repo, not here, so without this the crons
# would eventually be silently disabled. A weekly empty commit keeps the timer reset.
# (The dead-man's-switch would also catch a disable, so this is belt-and-suspenders.)

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.email "keepalive-bot@github.com"
          git config user.name "keepalive-bot"
          git commit --allow-empty -m "keepalive: $(date +%F)"
          git push
