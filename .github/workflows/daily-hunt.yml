name: Daily Domain Hunt

on:
  schedule:
    - cron: '0 2 * * *'   # 07:30 IST == 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: daily-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout state repo
        uses: actions/checkout@v4
        with:
          repository: abiram-blip/expired-domain-hunter-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state
          persist-credentials: true

      - name: Compute today's run date
        run: echo "EDH_RUN_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps + Playwright browser
        run: |
          pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore state (ledger.json, run/, session cookie)
        run: |
          cp state/ledger.json ./ledger.json
          cp state/ledger.json.bak ./ledger.json.bak 2>/dev/null || true
          rm -rf ./run && cp -r state/run ./run
          mkdir -p "./run/$EDH_RUN_DATE"
          # Harvest moved to the GoDaddy public feed (feed_harvest.py) — no login needed.
          # The cookie is only kept around harmlessly; copy is non-fatal if it's absent.
          cp state/expireddomains_cookies.json ~/expireddomains_cookies.json 2>/dev/null || true
          cp state/expireddomains_cookies.meta.json ~/expireddomains_cookies.meta.json 2>/dev/null || true

      - name: Render config.json
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_WEBAPP_TOKEN: ${{ secrets.SHEET_WEBAPP_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 render_config.py

      - name: Run daily hunt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # External dead-man's-switch (healthchecks.io-style). Pinged on run completion;
          # the monitor alerts if no ping lands in the daily window. No-op until the
          # HEALTHCHECK_PING_URL secret is set. See plan find-a-way-to-glistening-grove.
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          # Spend tracker lives in the STATE repo (persists across ephemeral runs), not
          # the code repo. OPENAI_STARTING_BALANCE_USD: update via a repo variable if it
          # ever changes; ask Claude to reset state/openai_spend.json after a top-up.
          OPENAI_SPEND_FILE: ${{ github.workspace }}/state/openai_spend.json
          OPENAI_STARTING_BALANCE_USD: "5.0"
          OPENAI_LOW_BALANCE_THRESHOLD_USD: "2.0"
        run: |
          set -o pipefail
          mkdir -p "run/$EDH_RUN_DATE"
          xvfb-run -a python3 run_pipeline.py 2>&1 | tee "run/$EDH_RUN_DATE/headless.log"

      - name: Save state back
        if: always()
        run: |
          cp ./ledger.json state/ledger.json
          cp ./ledger.json.bak state/ledger.json.bak 2>/dev/null || true
          rm -rf state/run && cp -r ./run state/run
          # NOTE: CI no longer writes the cookie back. The Mac refresh job
          # (refresh_cookie.sh) is the SOLE writer of expireddomains_cookies.json, so CI
          # cannot overwrite the authoritative fresh cookie with a rotated/degraded value.
          cd state
          git config user.email "actions@github.com"
          git config user.name "daily-hunt-bot"
          git add -A
          git diff --cached --quiet || git commit -m "state: $EDH_RUN_DATE"
          # Push with a rebase-retry so a concurrent state-repo push (e.g. the Mac cookie
          # refresh job) doesn't fail the run and strand today's ledger. CI only writes
          # ledger/run; the cookie job only writes cookie/meta/session_health.log — different
          # files, so a rebase replays cleanly. A genuine conflict aborts + fails loud
          # (the Alert-on-failure step fires) rather than silently dropping either side.
          git push || {
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "STATE REPO REBASE CONFLICT — not pushed"; exit 1; }
            git push
          }

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ ALERT: daily-hunt workflow failed — check https://github.com/abiram-blip/expired-domain-hunter/actions for logs.\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
